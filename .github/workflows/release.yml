name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # native/ (Rust) is compiled into the APK by the cargoNdkBuild Gradle task. Without cargo
      # the task is skipped and the app falls back to its Kotlin paths, so this step is what
      # keeps the published build fast. The NDK comes with the runner's Android SDK.
      - name: Set up Rust for Android
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      # Trakt credentials come from repository secrets: there is no keystore.properties on a
      # runner, and without these the published APK builds fine but ships a dead Trakt pane.
      # Unset (a fork with no secrets), they resolve to empty and the app reports itself
      # unconfigured rather than failing.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEYS: ${{ secrets.TMDB_API_KEYS }}

      - name: Install matching build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      # The signer handles every APK in the directory: one per ABI plus the universal (see
      # `splits` in app/build.gradle.kts). Lumora-armeabi-v7a.apk is the Fire TV stick build,
      # Lumora.apk the universal one for phones; x86 splits are for the emulator only.
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          for f in app-*-release*-signed.apk; do
            abi=$(echo "$f" | sed -E 's/^app-(.*)-release.*-signed\.apk$/\1/')
            case "$abi" in
              universal) mv "$f" Lumora.apk ;;
              armeabi-v7a|arm64-v8a) mv "$f" "Lumora-$abi.apk" ;;
            esac
          done
          ls -l Lumora*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APK
          path: app/build/outputs/apk/release/Lumora*.apk
          compression-level: 0

      # Release notes come from the tag's own section of CHANGELOG.md, so a release says
      # what actually changed rather than just "download the APK". The awk block takes
      # everything between this version's "## x.y" heading and the next one; if the tag has
      # no section (or the file is missing), it falls back to a generic body rather than
      # publishing an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Lumora ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$VERSION" '
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Installation"
            echo "Fire TV Stick / Android TV: Lumora-armeabi-v7a.apk (Lumora-arm64-v8a.apk on 64-bit boxes). Phones: Lumora.apk works everywhere."
          } > release-notes.md
          if [ "$(grep -c '[^[:space:]]' release-notes.md)" -le 4 ]; then
            echo "No CHANGELOG entry for $VERSION - using generic notes"
            printf '## Lumora %s\n\n### Installation\nFire TV Stick / Android TV: Lumora-armeabi-v7a.apk (Lumora-arm64-v8a.apk on 64-bit boxes). Phones: Lumora.apk works everywhere.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora-armeabi-v7a.apk
            app/build/outputs/apk/release/Lumora-arm64-v8a.apk
            app/build/outputs/apk/release/Lumora.apk
